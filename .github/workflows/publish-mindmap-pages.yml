name: Publish SIMRS Baru Mockup
on:
  push:
    branches:
      - main
    paths:
      - 'public/ui-preview/**'
      - 'tests/**'
      - '.github/workflows/publish-mindmap-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-simrs-baru
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate active UI JavaScript
        run: |
          for f in public/ui-preview/*.js; do node --check "$f"; done
          node --check tests/mockup-smoke.spec.mjs
      - name: Run active form, master, finance and journey tests
        run: node --test tests/*.test.mjs
      - name: Install browser test runner
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install Chromium and dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser responsive smoke tests
        run: npx playwright test --config=tests/playwright.config.mjs
      - name: Prepare only current mockup as GitHub Pages root
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a public/ui-preview/. _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/p0-forms.js
          test -f _site/synthetic-journey.js
          ! test -e _site/ui-preview
          ! test -e _site/role-worklists.js
          ! test -e _site/catalog.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
