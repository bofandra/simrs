name: Publish SIMRS-Sensi NUHA Gap Dashboard
on:
  push:
    branches:
      - main
    paths:
      - 'docs/gap-simrs-sensi-nuha/**'
      - '.github/workflows/publish-mindmap-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-gap-simrs-sensi-nuha
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish gap dashboard as site root
        run: |
          mkdir -p _site
          cp docs/gap-simrs-sensi-nuha/index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
