name: Publish SIMRS Baru Interactive Prototype
on:
  push:
    branches:
      - main
    paths:
      - 'docs/simrs-baru/**'
      - '.github/workflows/publish-mindmap-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-simrs-baru
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate prototype JavaScript
        run: |
          node --check docs/simrs-baru/catalog.js
          node --check docs/simrs-baru/app.js
          node --check docs/simrs-baru/database-tables.js
          node --check docs/simrs-baru/enhancements.js

      - name: Publish SIMRS Baru as site root
        run: |
          mkdir -p _site
          cp -a docs/simrs-baru/. _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
