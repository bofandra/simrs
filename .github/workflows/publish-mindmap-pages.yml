name: Publish SIMRS Baru Interactive Prototype
on:
  push:
    branches:
      - main
    paths:
      - 'docs/simrs-baru/**'
      - 'scripts/simrs-mockup-smoke.cjs'
      - 'scripts/simrs-mockup-browser.cjs'
      - '.github/workflows/publish-mindmap-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-simrs-baru
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate prototype JavaScript
        run: |
          node --check docs/simrs-baru/catalog.js
          node --check docs/simrs-baru/app.js
          node --check docs/simrs-baru/database-tables.js
          node --check docs/simrs-baru/enhancements.js
          node --check docs/simrs-baru/specialty.js
          node --check docs/simrs-baru/feature-map.js
          node --check docs/simrs-baru/care-journey.js
          node --check docs/simrs-baru/role-worklists.js
          node scripts/simrs-mockup-smoke.cjs

      - name: Install Chromium browser test dependencies
        run: |
          npm install --prefix .browser-ci --ignore-scripts --no-audit --no-fund --no-package-lock playwright@1.56.1
          .browser-ci/node_modules/.bin/playwright install chromium

      - name: Verify responsive UI in Chromium
        run: |
          NODE_PATH="$PWD/.browser-ci/node_modules" node scripts/simrs-mockup-browser.cjs

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simrs-role-worklists-browser-shots
          path: artifacts/browser/
          if-no-files-found: ignore

      - name: Publish SIMRS Baru as site root
        run: |
          mkdir -p _site
          cp -a docs/simrs-baru/. _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
