name: Mockup Forms P0-P1 Checks
on:
  pull_request:
    paths:
      - 'public/ui-preview/**'
      - 'tests/**'
      - '.github/workflows/mockup-forms-p0.yml'
  push:
    paths:
      - 'public/ui-preview/**'
      - 'tests/**'
      - '.github/workflows/mockup-forms-p0.yml'
permissions:
  contents: read
jobs:
  form-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check public/ui-preview/p0-form-catalog.js
          node --check public/ui-preview/p1-form-definitions.js
          node --check public/ui-preview/demo-workflow-links.js
          node --check public/ui-preview/p0-forms.js
      - name: P0/P1 form and demo workflow contract tests
        run: node --test tests/*.test.mjs
