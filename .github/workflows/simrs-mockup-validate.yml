name: Validate SIMRS Baru Mockup

on:
  pull_request:
    paths:
      - 'docs/simrs-baru/**'
      - 'scripts/simrs-mockup-smoke.cjs'
      - 'scripts/simrs-mockup-browser.cjs'
      - '.github/workflows/simrs-mockup-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Syntax validation
        run: |
          for f in docs/simrs-baru/*.js scripts/simrs-mockup-*.cjs; do node --check "$f"; done
      - name: State and workflow regression
        run: node scripts/simrs-mockup-smoke.cjs
      - name: Chromium test dependencies
        run: |
          npm install --prefix .browser-ci --ignore-scripts --no-audit --no-fund --no-package-lock playwright@1.56.1
          .browser-ci/node_modules/.bin/playwright install chromium
      - name: Browser responsive regression
        run: NODE_PATH="$PWD/.browser-ci/node_modules" node scripts/simrs-mockup-browser.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simrs-mockup-browser-screenshots
          path: artifacts/browser/
          if-no-files-found: ignore
